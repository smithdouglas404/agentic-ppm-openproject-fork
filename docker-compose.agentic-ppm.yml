services:
  agentic_ppm:
    image: openproject/ci-agentic-ppm:v1
    build:
      context: .
      dockerfile: ./docker/ci/Dockerfile.agentic-ppm
      platforms:
        - linux/amd64
      args:
        - APP_USER_UID
        - APP_USER_GID
        - RUBY_VERSION
    environment:
      CI_JOBS: "${CI_JOBS:-2}"
      RSPEC_RETRY_RETRY_COUNT: "${CI_RETRY_COUNT:-0}"
    tmpfs:
      - "/tmp"
    volumes:
      - .:/app
      - ${LOCAL_CACHE_PATH}/bundle:/usr/local/bundle
      - ${LOCAL_CACHE_PATH}/runtime-logs:/app/spec/support/runtime-logs
