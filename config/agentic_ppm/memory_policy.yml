version: 1
activation: requires_authorized_service_and_credentials
memory_backend: mem0
storage_contract:
  record_shape:
    required_fields:
      - memory_id
      - workspace_id
      - project_id
      - openproject_user_id
      - agent_invocation_key
      - authorization_policy
      - content_classification
      - source_citations
      - observed_at
      - memory_policy_version
      - retention_classification
      - record_version
  write_semantics:
    require_current_openproject_authorization: true
    require_source_citations: true
    require_content_classification: true
    require_trace_event: true
    reject_if_scope_is_incomplete: true
  update_semantics:
    preserve_prior_record_version: true
    require_new_authorization_decision: true
    require_new_observed_at: true
    require_update_trace_event: true
  deletion_semantics:
    backend_delete_required: true
    audit_tombstone_required: true
    tombstone_fields:
      - memory_id
      - deletion_trigger
      - deleted_at
      - authorization_decision
      - memory_policy_version
    prohibit_retrieval_after_tombstone: true
scope_dimensions:
  - workspace_id
  - project_id
  - openproject_user_id
  - agent_invocation_key
  - authorization_policy
extraction_policy:
  permit_only:
    - user_authorized_conversation_content
    - source_backed_openproject_evidence_summaries
    - user_confirmed_preferences
  prohibit:
    - connector_credentials
    - session_tokens
    - unscoped_cross_project_content
    - unverified_agent_inference_as_fact
retrieval_policy:
  require_all_scope_dimensions: true
  require_current_openproject_authorization: true
  require_source_citation: true
  deny_when_source_is_deleted_or_revoked: true
retention_policy:
  default_classification: governed_project_memory
  retention_period: workspace_policy_controlled
  deletion_triggers:
    - user_deletion_request
    - workspace_retention_expiry
    - source_revocation
    - project_access_revocation
  deletion_evidence: required
source_citation:
  required_fields:
    - source_system
    - source_record_identity
    - observed_at
    - authorization_provenance
    - memory_policy_version
observability:
  required_trace_fields:
    - memory_operation
    - workspace_id
    - project_id
    - openproject_user_id
    - agent_invocation_key
    - authorization_decision
    - source_citation_references
    - retention_classification
