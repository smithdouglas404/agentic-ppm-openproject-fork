name: agentic-ppm-frontend-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_frontend_artifact:
    name: Build OpenProject frontend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Generate linked frontend plugins
        working-directory: frontend
        run: npm run ci:plugins:register_frontend

      - name: Build production Angular assets
        working-directory: frontend
        run: node --max-old-space-size=4096 ./node_modules/@angular/cli/bin/ng build --configuration production --named-chunks --source-map=false

      - name: Package deployable frontend artifact
        run: tar -C public -czf openproject-frontend-assets.tgz assets/frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ppm-openproject-frontend-assets
          path: openproject-frontend-assets.tgz
          if-no-files-found: error
          retention-days: 7
